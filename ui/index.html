<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BMod</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">
      <section class="row">
        <img src="/icon.png" width="36" height="36" alt="BMod Icon">
        <h1>BMod</h1>
      </section>
      <p>Model + textures → Garry's Mod static prop</p>
    </div>
    <div id="env" class="env pending" title="">Checking toolchain…</div>
  </header>

  <main>
    <button type="button" class="file-card" id="model-card">
      <span class="label">Model</span>
      <span class="file" id="model-file">Drop or browse</span>
      <span class="hint" id="model-hint">.glb · .gltf · .obj</span>
    </button>

    <section class="panel">
      <h2>Materials</h2>
      <p id="materials-empty" class="muted">Load a model to see its material slots. Each slot gets its own texture.</p>
      <div id="materials"></div>
    </section>

    <section class="panel options">
      <label class="field wide">
        <span>Name</span>
        <input id="name" type="text" placeholder="from model file name" spellcheck="false" autocomplete="off">
      </label>
      <label class="field">
        <span>Scale <small>(units per metre)</small></span>
        <input id="scale" type="number" min="0.001" step="any" value="39.37">
      </label>
      <label class="field">
        <span>Surface</span>
        <select id="surfaceprop">
          <option value="default">Default</option>
          <option value="wood">Wood</option>
          <option value="wood_crate">Wood crate</option>
          <option value="wood_furniture">Wood furniture</option>
          <option value="metal">Metal</option>
          <option value="metal_box">Metal box</option>
          <option value="metalpanel">Metal panel</option>
          <option value="plastic">Plastic</option>
          <option value="concrete">Concrete</option>
          <option value="rock">Rock</option>
          <option value="glass">Glass</option>
          <option value="rubber">Rubber</option>
          <option value="cardboard">Cardboard</option>
          <option value="paper">Paper</option>
          <option value="carpet">Fabric / carpet</option>
          <option value="flesh">Flesh</option>
        </select>
      </label>
    </section>

    <section class="actions">
      <button type="button" id="convert" class="primary" disabled>Convert</button>
      <span id="output-hint" class="muted"></span>
    </section>

    <section id="result" class="result" hidden>
      <div>
        <strong id="result-title"></strong>
        <code id="result-detail"></code>
      </div>
      <button type="button" id="open-folder">Open folder</button>
    </section>

    <details class="log" id="log-box">
      <summary>Log</summary>
      <pre id="log"></pre>
    </details>
  </main>

  <template id="slot-template">
    <div class="slot">
      <div class="slot-head">
        <strong class="slot-name"></strong>
        <span class="muted slot-tris"></span>
      </div>
      <button type="button" class="tex-pick">
        <span class="tex-file">Choose texture…</span>
        <span class="tex-path muted"></span>
      </button>
      <div class="slot-opts">
        <label class="field">
          <span>Transparency</span>
          <select class="alpha">
            <option value="opaque">None</option>
            <option value="cutout">Cutout (alpha test)</option>
            <option value="translucent">Translucent</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" class="double-sided"><span>Double-sided</span></label>
        <label class="check"><input type="checkbox" class="scroll-on"><span>Scroll</span></label>
        <label class="field scroll-field">
          <span>Speed <small>(per sec)</small></span>
          <input type="number" class="scroll-rate" step="0.05" value="0.5">
        </label>
        <label class="field scroll-field">
          <span>Angle <small>(°, 90 = vertical)</small></span>
          <input type="number" class="scroll-angle" step="15" value="90">
        </label>
      </div>
    </div>
  </template>

  <script src="main.js"></script>
</body>
</html>
